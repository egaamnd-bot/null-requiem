name: Deploy preview to GitHub Pages

# Publishes the playable build from `main` to GitHub Pages.
#
# Opt-in so it never fails on repositories where Pages is unavailable (e.g. a private repo on
# a free plan). To enable:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → Variables → add PAGES_ENABLED = true
#   3. Re-run this workflow (or push to main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
