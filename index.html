<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Null Requiem</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305060c'/%3E%3Ccircle cx='8' cy='8' r='5' fill='none' stroke='%233cf2ff' stroke-width='1.5'/%3E%3Cpath d='M8 8 5 5' stroke='%23ff3ea5' stroke-width='1.5'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #05060c; overflow: hidden; touch-action: none; }
      #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; }
      noscript { color: #e8dcc8; font-family: system-ui, sans-serif; }
      /* Force landscape on mobile */
      @media screen and (orientation: portrait) and (max-width: 900px) {
        body::before {
          content: '';
          position: fixed; inset: 0; background: #05060c;
          z-index: 9999;
        }
        body::after {
          content: 'Rotate your device to landscape to play Null Requiem';
          position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          color: #3cf2ff; font-family: 'Courier New', monospace; font-size: 14px;
          text-align: center; padding: 24px;
          z-index: 10000;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Null Requiem needs JavaScript to run.</noscript>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
